exec-once = waybar
exec-once = mako

bind = SUPER, R, exec, rofi -show drun
bind = SUPER, Q, killactive
bind = SUPER, ESCAPE, exec, hyprctl kill
bind = SUPER, RETURN, exec, kitty
bind = SUPER, L, exec, hyprlock

bindel = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight --min-value=1 set 5%-
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume --limit 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

input {
	kb_layout = hu
	kb_variant =
	kb_model =
	kb_options =
	kb_rules =

	follow_mouse = 1
}
